<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04170b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="MONO GRAND PRIX - a retro monochrome first-person racer for your phone.">
<title>MONO GRAND PRIX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #04170b;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  #screen {
    position: fixed; top: 0; left: 0;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  /* CRT-ish bloom + vignette sitting on top of the canvas */
  #crt {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(139,255,192,0.055), rgba(0,0,0,0) 62%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.62) 100%);
    z-index: 3;
  }
  #crt::after {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0.20) 0px, rgba(0,0,0,0.20) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
    opacity: 0.5;
  }
  #rotate {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 18px;
    background: #04170b; color: #8bffc0;
    z-index: 5; pointer-events: none;
    letter-spacing: 3px; font-size: 13px; text-align: center;
  }
  #rotate b { font-size: 22px; letter-spacing: 6px; }
  @media (orientation: portrait) { #rotate { display: none; } }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="crt"></div>
<div id="rotate"><b>MONO GP</b><span>ROTATE THE DEVICE</span></div>
<script>
/*__GAME__*/
</script>
</body>
</html>
